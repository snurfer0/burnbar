name: release

# Pushing a tag like v0.1.0 builds the .plasmoid and attaches it to a GitHub release,
# which is where the widget's update check looks.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run package
      - name: Tag must match the version in plasmoid/metadata.json
        run: test -f "dist/burnbar-${GITHUB_REF_NAME#v}.plasmoid"
      - run: gh release create "$GITHUB_REF_NAME" dist/*.plasmoid --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
